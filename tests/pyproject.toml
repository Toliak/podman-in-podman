[project]
name = "pinp-tests"
version = "0.1.0"
description = "Black-box test suite for the pinp-e and pinp-i podman wrappers"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
norecursedirs = [".venv", "build", "dist", "selinux/results", "nonselinux/results"]
markers = [
  "selinux: opt-in QEMU/SELinux VM matrix (set PINP_SELINUX_TEST=1)",
  "nonselinux: opt-in QEMU non-SELinux golden path (set PINP_NONSELINUX_TEST=1)",
  "e2e: opt-in tests that require a real local podman",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["helpers"]
